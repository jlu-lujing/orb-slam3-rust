name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The `opencv` crate binds against the system OpenCV and needs libclang
      # for its build script; the vocabulary archive is tracked in the repo.
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          if pkg-config --exists opencv4; then
            echo "OpenCV already available: $(pkg-config --modversion opencv4)"
          else
            # `DPkg::Lock::Timeout` waits for the periodic apt jobs on the runner
            # instead of failing immediately.
            sudo apt-get install -y --no-install-recommends \
              -o DPkg::Lock::Timeout=300 libopencv-dev
          fi
          sudo apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=300 clang libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release --bins
