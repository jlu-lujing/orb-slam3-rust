[package]
name = "orb_slam3_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"
description = "A Rust reimplementation of ORB-SLAM3 (visual, visual-inertial and multi-map SLAM)"
repository = "https://github.com/jlu-lujing/orb-slam3-rust"
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["slam", "orb-slam3", "computer-vision", "robotics", "rgbd"]
categories = ["computer-vision", "science::robotics"]
# The ORB vocabulary ships as a 40 MiB archive and the C++ reference lives in a
# git submodule; neither belongs in a crates.io package.
exclude = ["3rdparty/ORB_SLAM3", "vocabulary/orbvoc.txt", "vocabulary/orbvoc.txt.tar.gz"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
md-5 = "0.11.0"
nalgebra = { version = "0.33.2", features = ["serde-serialize"] }
opencv = "0.98.2"
postcard = { version = "1.1", features = ["use-std"] }
rand = "0.10.0"
rayon = "1.11.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.228", features = ["derive"] }
eframe = { version = "0.37.0", optional = true }

[build-dependencies]
flate2 = "1.0"
tar = "0.4"

[features]
default = ['register-times','tracker-pause-resume','viewer']
register-times = []
tracker-pause-resume = []
viewer = []
gui = ["viewer", "dep:eframe"]

[[bin]]
name = "slam_viewer"
path = "src/bin/slam_viewer.rs"
required-features = ["gui"]

[profile.release]
lto = "fat"
codegen-units = 1
